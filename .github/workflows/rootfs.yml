name: Build iOS RootFS

on:
  workflow_dispatch:

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and build apfs-fuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libfuse3-dev libbz2-dev zlib1g-dev libattr1-dev hfsprogs rsync p7zip-full zstd jq curl
          gh repo clone sgan81/apfs-fuse /tmp/apfs-fuse -- --recursive
          mkdir -p /tmp/apfs-fuse/build && cd /tmp/apfs-fuse/build
          CXXFLAGS="-include cstdint" cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 .. && make -j$(nproc)
          sudo cp apfs-fuse /usr/local/bin/

      - name: Download iOS 16.7.16 IPSW
        run: |
          H="cdn-apple.com"
          P="2026WinterFCS/fullrestores/122-41597"
          G="B4469AA9-8E2B-4A0C-BA2D-C16060246978"
          F="iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
          URL="https://${H}/${P}/${G}/${F}"
          curl -fL "$URL" -o restore.ipsw || {
            API="api.ipsw.me/v4/device/iPhone10,3?type=ipsw"
            URL=$(curl -sA "Mozilla/5.0" "https://${API}" | jq -r '.firmwares[] | select(.buildid=="20H392") | .url')
            curl -fL "$URL" -o restore.ipsw
          }
          ls -lh restore.ipsw

      - name: Extract DMGs and build rootfs
        run: |
          mkdir -p ipsw_extracted
          7z x restore.ipsw -oipsw_extracted "*.dmg" -r
          rm -f restore.ipsw
          cd ipsw_extracted
          mapfile -t DMGS < <(find . -name "*.dmg" -printf "%s %p\n" | sort -rn | awk '{print $2}')
          set -- "${DMGS[@]}"
          sudo bash ../tools/mkiosroot.sh "$1" "$2" "$3" ../rootfs.img 15G
          sudo chown $USER:$USER ../rootfs.img
          cd ..
          rm -rf ipsw_extracted

      - name: Compress rootfs
        run: |
          zstd -T0 -8 rootfs.img -o rootfs.img.zst
          rm -f rootfs.img
          ls -lh rootfs.img.zst

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-rootfs
          path: rootfs.img.zst
          retention-days: 5
          
